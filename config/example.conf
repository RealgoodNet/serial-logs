# ============================================================
# 串口实例配置模板（复制本文件改名即用）
#
# 实例名 = 文件名去掉 .conf（只允许小写字母、数字、下划线、短横线）
# 例：config/atk1126b.conf -> 实例名 atk1126b
#
# 新增一个设备的完整步骤：
#   1) cp config/example.conf config/<实例名>.conf
#   2) 改下面 [serial] 的 device 和 baud（其余通常不用动）
#   3) systemctl --user enable --now seriald@<实例名>
#   4) serialctl list                      # 确认实例出现
#   5) serialctl attach -s <实例名>        # 交互；Ctrl+] 退出
#
# 日志自动写到 logs/<实例名>/YYYY-MM-DD.log 与 .jsonl
# ============================================================

[serial]
# USB 转串口的稳定路径。必须用 by-id，不能用 /dev/ttyUSB0（编号会变）。
# 查法：ls -l /dev/serial/by-id/
device = /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AL0783ER-if00-port0

# 波特率。常用值：9600 / 115200 / 921600 / 1500000（Rockchip 调试口）/ 3000000
baud = 1500000

# 数据位：5 / 6 / 7 / 8（几乎总是 8）
databits = 8

# 校验位：none / even / odd / mark / space
parity = none

# 停止位：1 / 1.5 / 2
stopbits = 1

# 流控：none / rtscts / xonxoff
flow = none

[log]
# 日志目录。留空 = logs/<实例名>/；填绝对路径则覆盖
dir =

# 设备不在（USB 没插）时，多久记一条 WAITING_DEVICE（秒）。
# 600 = 每 10 分钟一条（推荐）；30 = 每 30 秒一条（旧行为，会刷屏）
wait_log_interval = 600

# 日志保留天数：0 = 永久保留；例如 30 = 自动删除 30 天前的日志
retention_days = 0

[attach]
# 交互式 attach（行模式）识别板端提示符用的正则（Python bytes 正则）。
# 留空 = 内置通用规则： 用户@主机:(/|~)路径[#%$]
# 不同板子可各配各的，例如：
#   rv1126b：^(root@rv1126b-buildroot:[^ #]*[#\$])\s*$
#   ATK    ：^(\[root@ATK-[^]]*\][#$])\s*$
#   登录屏 ：.*(login:)\s*$
prompt =
