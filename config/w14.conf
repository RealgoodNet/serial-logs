# 实例：w14 板（预留，尚未接入）
# 说明：历史 logs/w14 目录里的内容属于 s41-5-18，已迁移；
#       本配置留给真正的 w14 板使用，接板前不要 enable。

[serial]
device = /dev/serial/by-id/REPLACE-WITH-W14-USB-SERIAL
baud = 115200
databits = 8
parity = none
stopbits = 1
flow = none

[log]
dir =                       # 留空 = logs/w14/
wait_log_interval = 600
retention_days = 0

[attach]
prompt =
