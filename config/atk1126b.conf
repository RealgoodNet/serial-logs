# 实例：正点原子 ATK-DLRV1126B（USB Type-C "UART" 口，CH9102）
# 接板确认：docs/ATK-DLRV1126B快速上手指引.pdf —— 调试串口 1500000
# 接板后：systemctl --user enable --now seriald@atk1126b

[serial]
device = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B7E002635-if00   # CH9102 -> /dev/ttyACM0
baud = 1500000
databits = 8
parity = none
stopbits = 1
flow = none

[log]
dir =                       # 留空 = logs/atk1126b/
wait_log_interval = 600
retention_days = 30

[attach]
prompt =                    # 接板后可按实际提示符补充，例如 ^(\[root@ATK-[^]]*\][#$])\s*$
