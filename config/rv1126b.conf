# 实例：RV1126B 开发板（FTDI FT232R，调试串口）

[serial]
device = /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AL0783ER-if00-port0  # by-id 稳定路径
baud = 1500000                                                          # Rockchip 调试口常用 1500000
databits = 8
parity = none
stopbits = 1
flow = none

[log]
dir =                       # 留空 = logs/rv1126b/
wait_log_interval = 600     # 板子不在时每 10 分钟记一条
retention_days = 30

[attach]
prompt =                    # 留空 = 内置通用规则
