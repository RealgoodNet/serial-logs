# 实例：s41-5-18 样机（CH340，115200）
# 说明：这台就是 2026-10 加密/演示任务用的摄像头样机；
#       历史上误命名为 w14，日志目录已按项目名迁移到 logs/s41-5-18/。

[serial]
device = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0   # CH340
baud = 115200
databits = 8
parity = none
stopbits = 1
flow = none

[log]
dir =                       # 留空 = logs/s41-5-18/
wait_log_interval = 600
retention_days = 30

[attach]
prompt =                    # 留空 = 内置通用规则
